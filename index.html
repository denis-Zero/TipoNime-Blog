<!DOCTYPE html><html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TipoNime</title><style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0d0d0d;
        color: #fff;
    }

    header {
        background: #b30000;
        padding: 15px;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
    }

    .container {
        display: flex;
        max-width: 1200px;
        margin: auto;
    }

    .sidebar {
        width: 250px;
        background: #1a1a1a;
        padding: 20px;
        text-align: center;
        border-right: 2px solid #b30000;
    }

    .sidebar img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 3px solid #b30000;
    }

    .content {
        flex: 1;
        padding: 15px;
    }

    .post {
        background: #1a1a1a;
        margin-bottom: 15px;
        padding: 15px;
        border-left: 4px solid #b30000;
    }

    .post h3 {
        margin: 0;
        color: #ff3333;
        font-size: 18px;
    }

    .post p {
        margin-top: 8px;
        line-height: 1.4;
        font-size: 14px;
        white-space: pre-line;
    }

    footer {
        text-align: center;
        padding: 10px;
        background: #111;
        border-top: 1px solid #b30000;
        font-size: 12px;
    }

    @media (max-width: 768px) {
        .container {
            flex-direction: column;
        }

        .sidebar {
            width: 100%;
            border-right: none;
            border-bottom: 2px solid #b30000;
            padding: 15px;
        }

        .sidebar img {
            width: 80px;
            height: 80px;
        }

        .content {
            padding: 10px;
        }

        .post {
            padding: 12px;
        }

        .post h3 {
            font-size: 16px;
        }

        .post p {
            font-size: 13px;
        }
    }
</style></head>
<body><header>TipoNime</header><div class="container"><div class="sidebar">
    <img src="imagens/perfil.png" alt="perfil">
    <h2>TipoNime</h2>
    <p>Blog de animes</p>
</div>

<div class="content" id="posts"></div>

</div><footer>
    © 2026 TipoNime
</footer><script>
/*
📂 SISTEMA DE ARTIGOS VIA TXT

Crie uma pasta chamada: /artigos

Cada arquivo .txt deve seguir esse formato:

Linha 1 = Título
Linha 2+ = Conteúdo
*/

const arquivos = [
    "artigos/artigo1.txt",
    "artigos/artigo2.txt"
];

const container = document.getElementById("posts");

async function carregarArtigos() {
    for (let caminho of arquivos) {
        try {
            const resposta = await fetch(caminho);
            const texto = await resposta.text();

            const linhas = texto.split("\n");
            const titulo = linhas.shift();
            const conteudo = linhas.join("\n");

            criarPost(titulo, conteudo);

        } catch (erro) {
            console.error("Erro ao carregar:", caminho);
        }
    }
}

function criarPost(titulo, conteudo) {
    const div = document.createElement("div");
    div.classList.add("post");

    div.innerHTML = `
        <h3>${titulo}</h3>
        <p>${conteudo}</p>
    `;

    container.appendChild(div);
}

carregarArtigos();
</script></body>
</html>
